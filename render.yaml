# Render Blueprint — deploys the Spring Boot API (Docker) only.
# The frontend is deployed separately on Vercel (see client/vercel.json + the deploy guide).
# Secrets are marked `sync: false`; fill them in the Render dashboard after the first apply.
services:
  - type: web
    name: elproyectegrande-api
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false          # jdbc:postgresql://...supabase.com:5432/postgres?sslmode=require
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: onboarding@resend.dev
      - key: MAIL_OWNER_INBOX
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false          # your Vercel URL, e.g. https://el-proyecte-grande.vercel.app
