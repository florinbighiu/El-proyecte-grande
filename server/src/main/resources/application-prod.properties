# Production profile — activated inside the Docker image (--spring.profiles.active=prod).
# Contains NO secrets: every sensitive value is read from an environment variable that
# you set in the Render dashboard (DB_URL, DB_PASSWORD, RESEND_API_KEY, ...).
# Local development is unaffected and keeps using the gitignored application.properties.

server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.open-in-view=false

# Password-reset emails (SMTP / JavaMailSender)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Contact-form + checkout emails (Resend)
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:onboarding@resend.dev}
app.mail.owner-inbox=${MAIL_OWNER_INBOX:}

# Used to build password-reset links (set to your deployed frontend URL)
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
